# Keep existing NEXUSDB_* service settings above the sections below.
# Replace equivalent NEXUSDB_COMPUTE_* settings; do not define both forms.
[compute]
backend = "AUTO"
threads = 12
memory_mb = 512
max_jobs = 2
timeout_ms = 300000

[compute.cuda]
enabled = true
# Optional absolute path; otherwise loads the DLL beside nexusdb.exe.
# library = 'C:/Program Files/NexusDB/bin/nexusdb_cuda.dll'
